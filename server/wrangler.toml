# Bản đang chạy: Cloudflare Worker tro-ly-gv (tro-ly-gv.toannguyen210579.workers.dev).
# Mỗi lần đẩy thay đổi trong thư mục server/ lên GitHub, workflow trien_khai_may_chu.yml tự triển khai.
name = "tro-ly-gv"
main = "worker.js"
account_id = "e426acb896fd3c971495416845add55b"
keep_vars = true
compatibility_date = "2026-11-01"

# Gemini không cho gọi từ Hồng Kông (máy chủ Cloudflare gần Việt Nam nhất), nên đặt Worker chạy ở Mỹ.
[placement]
region = "gcp:us-central1"

# Biến AI_ENABLED đặt trên bảng điều khiển Cloudflare (keep_vars giữ nguyên khi triển khai)

# Bộ đếm lượt, cờ Pro/chặn, báo cáo nội dung AI (bảng tạo bằng schema.sql)
[[d1_databases]]
binding = "DB"
database_name = "tro-ly-gv-db"
database_id = "999a474c-079c-4633-8aa4-45cf776232c2"

# Khóa Claude đặt bằng: npx wrangler secret put ANTHROPIC_API_KEY (không ghi vào tệp này)
