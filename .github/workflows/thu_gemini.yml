name: Thử Gemini
on:
  workflow_dispatch:
  push:
    branches: [noi-may-chu]
    paths: [".github/workflows/thu_gemini.yml"]
jobs:
  thu:
    runs-on: ubuntu-latest
    steps:
      - name: Danh sách mô hình Flash và thử một câu
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -sS -H "x-goog-api-key: $K" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" \
            | python3 -c "import json,sys; [print(m['name'], m.get('displayName','')) for m in json.load(sys.stdin).get('models',[]) if 'flash' in m['name']]"
          for M in gemini-flash-latest gemini-flash-lite-latest; do
            S=$(date +%s)
            curl -sS -m 90 -H "x-goog-api-key: $K" -H 'content-type: application/json' \
              "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent" \
              -d '{"contents":[{"parts":[{"text":"Gợi ý một trò chơi khởi động 3 phút cho tiết Toán lớp 6, trả lời ngắn."}]}]}' \
              | python3 -c "import json,sys; j=json.load(sys.stdin); c=(j.get('candidates') or [{}])[0]; print('$M', j.get('modelVersion'), c.get('finishReason'), j.get('usageMetadata'), j.get('error',{}).get('message','')); print(''.join(p.get('text','') for p in c.get('content',{}).get('parts',[]) if not p.get('thought'))[:300])"
            echo "giây: $(( $(date +%s) - S ))"
          done
