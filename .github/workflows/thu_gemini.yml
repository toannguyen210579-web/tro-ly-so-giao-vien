name: Thử Gemini
on:
  workflow_dispatch:
  push:
    branches: [noi-may-chu]
    paths: [".github/workflows/thu_gemini.yml"]
jobs:
  thu:
    runs-on: ubuntu-latest
    steps:
      - name: Thử đọc tiếng Việt bằng các mô hình TTS của Gemini (gói miễn phí)
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir am
          curl -sS -H "x-goog-api-key: $K" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000" \
            | python3 -c "import json,sys; [print(m['name'].split('/')[1]) for m in json.load(sys.stdin).get('models',[]) if 'tts' in m['name']]" > mo_hinh.txt
          echo "Mô hình TTS: $(tr '\n' ' ' < mo_hinh.txt)"
          for M in $(cat mo_hinh.txt); do
            S=$(date +%s%N)
            curl -sS -m 90 -H "x-goog-api-key: $K" -H 'content-type: application/json' \
              "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent" \
              -d '{"contents":[{"parts":[{"text":"Kính gửi quý phụ huynh em Nguyễn Văn An. Nhà trường kính mời quý phụ huynh dự họp lúc bảy giờ sáng Chủ nhật, ngày hai mươi hai tháng mười một."}]}],"generationConfig":{"responseModalities":["AUDIO"],"speechConfig":{"voiceConfig":{"prebuiltVoiceConfig":{"voiceName":"Kore"}}}}}' > r.json
            E=$(( ($(date +%s%N) - S) / 1000000 ))
            python3 - "$M" "$E" <<'P'
          import json,sys,base64
          m,e=sys.argv[1],sys.argv[2]
          j=json.load(open('r.json'))
          if 'error' in j:
              print('KQ',m,e+'ms','LOI',j['error'].get('code'),j['error'].get('status'),j['error'].get('message','')[:160]); sys.exit()
          p=j['candidates'][0]['content']['parts'][0]['inlineData']
          d=base64.b64decode(p['data']); open('am/'+m+'.pcm','wb').write(d)
          print('KQ',m,e+'ms','OK',p.get('mimeType'),len(d),'byte, khoảng',round(len(d)/48000,1),'giây')
          P
          done
          for f in am/*.pcm; do [ -f "$f" ] && ffmpeg -loglevel error -f s16le -ar 24000 -ac 1 -i "$f" "${f%.pcm}.mp3"; done; ls -la am
      - uses: actions/upload-artifact@v4
        with:
          name: giong-gemini
          path: am/*.mp3
