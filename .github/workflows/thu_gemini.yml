name: Thử Gemini
on:
  workflow_dispatch:
  push:
    branches: [noi-may-chu]
    paths: [".github/workflows/thu_gemini.yml"]
jobs:
  thu:
    runs-on: ubuntu-latest
    steps:
      - name: Thử Gemini tìm trên Google (gói miễn phí) như các trang AI khác
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for M in gemini-2.5-flash gemini-2.5-flash-lite; do
          for Q in "clip trên việt nam tiêu điểm nào hay nhất" "giá vàng SJC hôm nay bao nhiêu" "lịch nghỉ Tết Nguyên đán 2027 của giáo viên"; do
            S=$(date +%s%N)
            curl -sS -m 60 -H "x-goog-api-key: $K" -H 'content-type: application/json' \
              "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent" \
              -d "$(python3 -c 'import json,sys;print(json.dumps({"contents":[{"parts":[{"text":sys.argv[1]}]}],"tools":[{"google_search":{}}],"systemInstruction":{"parts":[{"text":"Trả lời bằng tiếng Việt, ngắn gọn, nêu nguồn."}]}}))' "$Q")" > r.json
            E=$(( ($(date +%s%N) - S) / 1000000 ))
            python3 - "$M" "$Q" "$E" <<'P'
          import json,sys
          m,q,e=sys.argv[1:]
          j=json.load(open('r.json'))
          if 'error' in j: print('KQ',m,'|',q,'|',e,'ms LOI',j['error'].get('code'),j['error'].get('message','')[:150]); sys.exit()
          c=j['candidates'][0]; t=''.join(p.get('text','') for p in c['content'].get('parts',[]))
          g=c.get('groundingMetadata',{}); src=[x.get('web',{}).get('title','') for x in g.get('groundingChunks',[])]
          print('KQ',m,'|',q,'|',e,'ms | nguon:',len(src),src[:5]); print('   ',t[:500].replace('\n',' / '))
          P
          done; done
