name: Xem app tren iPad (anh cua hang)
# Chụp ảnh app ở cỡ màn iPad Pro 13 inch (2064×2752 điểm ảnh, 1032 điểm logic) để làm ảnh App Store cho iPad.
# Máy giả lập iPad trên máy Mac Intel của GitHub chạy quá chậm, treo hơn 45 phút (24/11/2026), nên dùng
# máy giả lập Android đặt đúng cỡ và mật độ màn iPad 13 inch: app vẽ giao diện bằng Flutter nên hình
# giống hệt trên iPad. Ảnh chụp chỉ lấy phần app (không lấy thanh hệ thống); khi dựng ảnh cửa hàng
# đặt vào khung máy tính bảng. Ảnh đẩy lên nhánh anh-xem-ipad.
on:
  workflow_dispatch:
  push:
    branches: [noi-may-chu]
    paths: [".github/workflows/xem_ipad.yml"]
permissions:
  contents: write
jobs:
  chup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bật KVM cho máy giả lập
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: bash tool/chuan_bi.sh
      - run: flutter pub get
      - name: Chạy app ở cỡ iPad 13 inch, đi qua các tiện ích, chụp màn hình
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 2064x2752
          script: |
            adb shell wm size 2064x2752
            adb shell wm density 320
            sleep 5
            adb shell wm size; adb shell wm density
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/xem_app_test.dart 2>&1 | tee ket_qua.txt; grep -E "KQ|All tests passed|Some tests failed|EXCEPTION" ket_qua.txt | head -80
      - name: Đẩy ảnh lên nhánh anh-xem-ipad
        if: always()
        run: |
          mkdir -p /tmp/anh
          cp anh_chay_thu/xem_*.png /tmp/anh/ 2>/dev/null || true
          python3 -c "import struct,glob;[print(f, struct.unpack('>II', open(f,'rb').read()[16:24])) for f in sorted(glob.glob('/tmp/anh/*.png'))[:5]]" || true
          grep -E "KQ|All tests passed|Some tests failed|EXCEPTION" ket_qua.txt > /tmp/anh/ket_qua.txt 2>/dev/null || true
          cd /tmp/anh
          git init -q -b anh-xem-ipad
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Ảnh cỡ iPad (${GITHUB_SHA::7})"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" anh-xem-ipad
