name: Ma goi ban quoc te
# Đăng ký mã gói (Bundle ID) cho bản quốc tế TeachDesk trên tài khoản Apple Developer, nếu chưa có.
# Người dùng đồng ý lập app mới cho bản quốc tế ngày 28/11/2026. Chạy lại không tạo trùng.
# App trên App Store Connect phải lập bằng tay trên trang (Apple không cho lập qua API).
on:
  workflow_dispatch:
  push:
    branches: [ban-quoc-te]
    paths: [".github/workflows/ma_goi_qt.yml"]

permissions:
  contents: read

jobs:
  dang_ky:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cài thư viện ký JWT
        run: pip install --quiet pyjwt cryptography
      - name: Đăng ký mã gói nếu chưa có
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 4J84ST68KM
          ASC_ISSUER_ID: adfaa10b-1308-4779-8c38-1729ecad72df
          MA_GOI: vn.vietnamtieudiem.troLySoGiaoVien.intl
          TEN: TeachDesk
        shell: python
        run: |
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          import jwt
          KEY = os.environ["ASC_KEY_P8"]
          KID, ISS = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          MA, TEN = os.environ["MA_GOI"], os.environ["TEN"]
          BASE = "https://api.appstoreconnect.apple.com"

          def bao(m):
              print(f"::notice title=Ma goi::{m}")

          def token():
              now = int(time.time())
              return jwt.encode({"iss": ISS, "iat": now, "exp": now + 1100, "aud": "appstoreconnect-v1"},
                                KEY, algorithm="ES256", headers={"kid": KID, "typ": "JWT"})

          def api(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(BASE + path, data=data, method=method,
                                           headers={"Authorization": "Bearer " + token(), "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read()
                      return r.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try:
                      return e.code, json.loads(raw)
                  except Exception:
                      return e.code, {"raw": raw.decode("utf-8", "replace")[:500]}

          ma, kq = api("GET", "/v1/bundleIds?filter[identifier]=" + urllib.parse.quote(MA) + "&limit=50")
          if ma != 200:
              print(kq)
              sys.exit("Không đọc được danh sách mã gói: " + str(ma))
          co = [b for b in kq.get("data", []) if b["attributes"]["identifier"] == MA]
          if co:
              bao(f"Mã gói {MA} đã có sẵn (id {co[0]['id']}, tên {co[0]['attributes']['name']}).")
              sys.exit(0)
          ma, kq = api("POST", "/v1/bundleIds", {"data": {"type": "bundleIds", "attributes": {
              "identifier": MA, "name": TEN, "platform": "IOS"}}})
          if ma not in (200, 201):
              print(kq)
              sys.exit("Không đăng ký được mã gói: " + str(ma))
          bao(f"Đã đăng ký mã gói {MA} (id {kq['data']['id']}), tên {TEN}.")
