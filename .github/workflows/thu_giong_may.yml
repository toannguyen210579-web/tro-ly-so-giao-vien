name: Thử giọng đọc cài sẵn
on:
  workflow_dispatch:
  push:
    branches: [noi-may-chu]
    paths: [".github/workflows/thu_giong_may.yml"]
jobs:
  thu:
    runs-on: ubuntu-latest
    steps:
      - name: Tìm giọng tiếng Việt của sherpa-onnx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/k2-fsa/sherpa-onnx/releases/tags/tts-models --paginate -q '.assets[]|select(.name|test("vi";"i"))|[.name,.size]|@tsv' | tee ds.txt
      - name: Đọc thử câu tiếng Việt, đo thời gian
        run: |
          pip install -q sherpa-onnx
          mkdir am
          for M in vits-piper-vi_VN-vais1000-medium-int8.tar.bz2 vits-piper-vi_VN-25hours_single-low-int8.tar.bz2 vits-piper-vi_VN-vivos-x_low-int8.tar.bz2 vits-piper-vi_VN-vais1000-medium.tar.bz2; do
            curl -sSL -o m.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$M"
            rm -rf mo && mkdir mo && tar xjf m.tar.bz2 -C mo
            D=$(ls -d mo/*/); echo "== $M  nén $(du -h m.tar.bz2|cut -f1), giải nén $(du -sh $D|cut -f1)"; ls $D
            python3 - "$D" "am/${M%.tar.bz2}.wav" <<'P'
          import sys,time,glob,os,sherpa_onnx,wave,array
          d,out=sys.argv[1],sys.argv[2]
          onnx=[f for f in glob.glob(d+'*.onnx')][0]
          cfg=sherpa_onnx.OfflineTtsConfig(model=sherpa_onnx.OfflineTtsModelConfig(vits=sherpa_onnx.OfflineTtsVitsModelConfig(model=onnx,tokens=d+'tokens.txt',data_dir=d+'espeak-ng-data'),num_threads=2))
          t=time.time(); tts=sherpa_onnx.OfflineTts(cfg); t1=time.time()
          a=tts.generate("Kính gửi quý phụ huynh em Nguyễn Văn An. Nhà trường kính mời quý phụ huynh dự họp lúc bảy giờ sáng Chủ nhật, ngày hai mươi hai tháng mười một.",sid=0,speed=1.0)
          t2=time.time()
          print('KQ',os.path.basename(onnx),'nap',round(t1-t,1),'s; tao',round(t2-t1,1),'s cho',round(len(a.samples)/a.sample_rate,1),'s am thanh')
          w=wave.open(out,'wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(a.sample_rate)
          w.writeframes(array.array('h',[max(-32767,min(32767,int(x*32767))) for x in a.samples]).tobytes()); w.close()
          P
          done
          ls -la am
      - uses: actions/upload-artifact@v4
        with:
          name: giong-may
          path: am/*.wav
      - name: Lấy giao diện Dart của sherpa_onnx
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/k2-fsa/sherpa-onnx s && cd s && git sparse-checkout set flutter/sherpa_onnx
          grep -n "version:" flutter/sherpa_onnx/pubspec.yaml
          F=$(grep -rl "class OfflineTts " flutter/sherpa_onnx/lib); echo $F
          grep -n "class OfflineTts\|OfflineTtsVitsModelConfig({\|OfflineTtsModelConfig({\|OfflineTtsConfig({\|generate(\|GeneratedAudio\|required\|this\.\|void initBindings\|writeWave" $F flutter/sherpa_onnx/lib/sherpa_onnx.dart flutter/sherpa_onnx/lib/src/wave_writer.dart 2>/dev/null | head -80
