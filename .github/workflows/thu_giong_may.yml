name: Thử giọng đọc cài sẵn
on:
  workflow_dispatch:
  push:
    branches: [noi-may-chu]
    paths: [".github/workflows/thu_giong_may.yml"]
jobs:
  thu:
    runs-on: ubuntu-latest
    steps:
      - name: Xem cách dùng
        run: |
          pip install -q sherpa-onnx
          pip show sherpa-onnx | grep -i version
          python3 -c "import sherpa_onnx as s; print(s.OfflineTtsVitsModelConfig.__init__.__doc__); print(s.OfflineTtsModelConfig.__init__.__doc__); print(s.OfflineTtsConfig.__init__.__doc__)"
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/k2-fsa/sherpa-onnx s && cd s && git sparse-checkout set python-api-examples flutter/sherpa_onnx/lib flutter/sherpa_onnx/pubspec.yaml
          grep -n "vits\|data_dir\|espeak\|lexicon\|phoneme" python-api-examples/offline-tts.py | head -40
          grep -n "^version" flutter/sherpa_onnx/pubspec.yaml
          F=$(grep -rl "class OfflineTtsVitsModelConfig" flutter/sherpa_onnx/lib); echo "TEP $F"; sed -n '1,400p' $F | grep -n "class \|this\.\|required\|generate\|Future\|static\|factory" | head -120
          grep -rn "initBindings\|writeWave" flutter/sherpa_onnx/lib | head
          curl -sSL -o m.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-vi_VN-vais1000-medium-int8.tar.bz2 && tar xjf m.tar.bz2 && cat vits-piper-vi_VN-vais1000-medium-int8/MODEL_CARD | head -30; ls vits-piper-vi_VN-vais1000-medium-int8/espeak-ng-data | head; ls vits-piper-vi_VN-vais1000-medium-int8/espeak-ng-data | wc -l
