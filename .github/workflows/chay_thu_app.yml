name: Chạy thử app trên máy Android giả lập
on:
  workflow_dispatch:
  push:
    branches: [noi-may-chu]
    paths: ["integration_test/chay_thu_test.dart", ".github/workflows/chay_thu_app.yml"]
permissions:
  contents: write
jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bật KVM cho máy giả lập
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: bash tool/chuan_bi.sh
      - run: flutter pub get
      - name: Chạy app trên Android 14 (x86_64), chụp từng màn hình
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/chay_thu_test.dart 2>&1 | tee ket_qua.txt; grep -E "KQ|All tests passed|Some tests failed|EXCEPTION|Error" ket_qua.txt | head -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anh-chay-thu
          path: |
            anh_chay_thu/*.png
            ket_qua.txt
      - name: Đẩy ảnh, kết quả lên nhánh anh-chay-thu (tải về bằng git, máy làm việc không tải được Artifacts)
        if: always()
        run: |
          mkdir -p /tmp/anh
          cp anh_chay_thu/*.png /tmp/anh/ 2>/dev/null || true
          grep -E "KQ|All tests passed|Some tests failed|EXCEPTION" ket_qua.txt > /tmp/anh/ket_qua.txt 2>/dev/null || true
          cd /tmp/anh
          git init -q -b anh-chay-thu
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Ảnh chạy thử app (${GITHUB_SHA::7})"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" anh-chay-thu
