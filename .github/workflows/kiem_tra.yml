name: Kiem tra va dong goi

on:
  push:
    # Nhánh bản quốc tế (ban-quoc-te) có tệp quoc_te.yml riêng, không đóng gói bản Việt ở đó
    branches: [noi-may-chu]
    # Chỉ đóng gói lại khi mã app thay đổi (sửa máy chủ không cần đóng gói app)
    paths-ignore: ["server/**", "cua-hang/**", "tool/anh_cua_hang/**", ".github/workflows/xem_ipad.yml", ".github/workflows/anh_app_store.yml", ".github/workflows/gan_ban_app_store.yml", ".github/workflows/testflight_trang_thai.yml", ".github/workflows/trien_khai_may_chu.yml", ".github/workflows/thu_gemini.yml", ".github/workflows/testflight_noi_bo.yml", ".github/workflows/do_giai_de.yml", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/chuan_bi.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Mở thử tệp Excel app tạo bằng thư viện khác
        run: |
          pip install --quiet openpyxl
          python3 -c "
          import openpyxl
          wb = openpyxl.load_workbook('build/thu_danh_muc_minh_chung.xlsx')
          ws = wb.active
          print('Trang:', ws.title, '| số dòng:', ws.max_row, '| số cột:', ws.max_column)
          for r in ws.iter_rows(values_only=True): print(r)
          assert ws.max_row == 3 and ws.cell(3, 6).value == 'Số 88/GCN-SGDĐT, Sở GD&ĐT'
          "
      - name: Mở thử tệp Word bảng lương và bộ thẻ Giơ thẻ bằng thư viện khác
        run: |
          pip install --quiet python-docx pypdf
          python3 -c "
          import docx, pypdf
          d = docx.Document('build/thu_bang_luong.docx')
          t = d.tables[0]
          print('Bảng lương: số dòng', len(t.rows), '|', [c.text for c in t.rows[2].cells])
          print('Đoạn:', [p.text for p in d.paragraphs if p.text])
          assert len(t.rows) == 3 and t.rows[2].cells[2].text == '9.000.000'
          r = pypdf.PdfReader('build/thu_bo_the.pdf')
          print('Bộ thẻ: số trang', len(r.pages), '| cỡ trang', r.pages[0].mediabox)
          assert len(r.pages) == 20
          "
      - name: Mở thử tệp PowerPoint, PDF bài trình chiếu bằng thư viện khác
        run: |
          pip install --quiet python-pptx pypdf
          python3 -c "
          import pptx, pypdf
          for ten in ['build/thu_trinh_chieu.pptx', 'build/thu_trinh_chieu_mau_tim.pptx']:
              p = pptx.Presentation(ten)
              print(ten, '| số trang', len(p.slides), '| khổ', p.slide_width, p.slide_height)
              assert len(p.slides) == 6 and (p.slide_width, p.slide_height) == (12192000, 6858000)
              for i, s in enumerate(p.slides, 1):
                  chu = [sh.text_frame.text for sh in s.shapes if sh.has_text_frame and sh.text_frame.text]
                  print(i, chu, '| ghi chú:', s.notes_slide.notes_text_frame.text if s.has_notes_slide else None)
          p = pptx.Presentation('build/thu_trinh_chieu.pptx')
          assert 'Đáp án: C1' in p.slides[4].notes_slide.notes_text_frame.text
          assert any('Khái niệm phân số <a & b>' in sh.text_frame.text for sh in p.slides[3].shapes if sh.has_text_frame)
          r = pypdf.PdfReader('build/thu_trinh_chieu.pdf')
          print('PDF: số trang', len(r.pages), '| cỡ trang', r.pages[0].mediabox)
          assert len(r.pages) == 7 and float(r.pages[0].mediabox.width) == 960 and float(r.pages[0].mediabox.height) == 540
          t4 = r.pages[3].extract_text()
          print('Chữ trang 4 của PDF:', t4)
          assert 'a/b' in t4
          "
      - name: Đẩy tệp Word văn bản Đảng, bài trình chiếu mẫu lên nhánh tep-thu (để xem lại)
        if: always()
        run: |
          mkdir -p /tmp/tep && cp build/thu_*_chi_bo.docx build/thu_trinh_chieu* /tmp/tep/ 2>/dev/null || true
          cd /tmp/tep && ls && git init -q -b tep-thu && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Tệp thử (${GITHUB_SHA::7})" \
            && git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tep-thu || true
      # Kho thư viện Maven đôi khi báo quá tải (429): chờ rồi đóng gói lại, tối đa 3 lần
      - run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Đóng gói lỗi lần $i, chờ rồi thử lại"; sleep $((i * 60))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: tro-ly-so-gv-android
          path: build/app/outputs/flutter-apk/app-release.apk
      # Bản đóng gói để tải lên Google Play (AAB)
      - run: |
          for i in 1 2 3; do
            flutter build appbundle --release && exit 0
            echo "Đóng gói AAB lỗi lần $i, chờ rồi thử lại"; sleep $((i * 60))
          done
          exit 1
      - name: Kiểm tra bản đóng gói (mã gói, phiên bản, Android đích, chữ ký)
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          $AAPT dump badging build/app/outputs/flutter-apk/app-release.apk | grep -E "^package:|targetSdkVersion|sdkVersion|uses-permission" || true
          ls -la build/app/outputs/bundle/release/
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | head -3
      - name: Dung lượng tải về trên từng loại máy (Google Play giới hạn 200 MB)
        run: |
          curl -sL -o bt.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar bt.jar build-apks --bundle=build/app/outputs/bundle/release/app-release.aab --output=thu.apks
          java -jar bt.jar get-size total --apks=thu.apks --dimensions=ABI
      - uses: actions/upload-artifact@v4
        with:
          name: tro-ly-so-gv-google-play-aab
          path: build/app/outputs/bundle/release/app-release.aab

  ios:
    # Máy Mac tính phút gấp 10 lần, nên bản iPhone chỉ đóng gói khi bấm chạy tay
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Máy Intel mặc định dùng Xcode cũ; thư viện video_player cần Swift mới
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/chuan_bi.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Kiểm tra cấu hình (iPhone và iPad, xoay 4 chiều trên iPad, mã hóa, câu xin quyền máy ảnh)
        run: |
          grep -c 'TARGETED_DEVICE_FAMILY = "1,2";' ios/Runner.xcodeproj/project.pbxproj
          if grep -q 'TARGETED_DEVICE_FAMILY = 1;' ios/Runner.xcodeproj/project.pbxproj; then echo "Còn cấu hình chỉ iPhone"; exit 1; fi
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations~ipad' ios/Runner/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations~ipad' ios/Runner/Info.plist | grep -c UIInterfaceOrientation)" = 4
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' ios/Runner/Info.plist
      # Đóng gói bản lưu trữ (xcarchive) chưa ký; bước sau ký bằng chứng chỉ do Apple quản lý
      - run: flutter build ipa --release --no-codesign
      # Ký và đẩy lên TestFlight bằng khóa API App Store Connect (quyền Admin).
      # Key ID, Issuer ID không phải bí mật; khóa riêng .p8 lấy từ secret ASC_KEY_P8 do người dùng tự cất.
      - name: Ký bản iPhone và đẩy lên TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 4J84ST68KM
          ASC_ISSUER_ID: adfaa10b-1308-4779-8c38-1729ecad72df
          TEAM_ID: D4MA24SYBY
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "Chưa có secret ASC_KEY_P8, bỏ qua bước ký"; exit 0; fi
          KEY=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          ARCHIVE=$(ls -d build/ios/archive/*.xcarchive | head -1)
          echo "Bản lưu trữ: $ARCHIVE"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      # Lỗi xuất bản iPhone (vd 24/11/2026: "exportArchive The data couldn't be read because it
      # isn't in the correct format") chỉ ghi chi tiết trong gói nhật ký .xcdistributionlogs:
      # in các dòng lỗi ra nhật ký chạy, bỏ dòng có thể chứa khóa, không tải gói nhật ký lên.
      - name: Nhật ký xuất bản iPhone khi lỗi
        if: failure()
        run: |
          for d in $(find /var/folders "${TMPDIR:-/tmp}" -maxdepth 6 -name "*.xcdistributionlogs" 2>/dev/null | sort -u); do
            echo "== $d"; ls "$d"
            for f in "$d"/*.log; do
              echo "--- $(basename "$f")"
              grep -iE "error|fail|format|plist|invalid|denied|agreement|status|unable|couldn" "$f" \
                | grep -viE "bearer|authorization|token|private key|BEGIN" | tail -60 | cut -c1-400
            done
          done
      - name: Xóa tệp khóa tạm
        if: always()
        run: rm -f $RUNNER_TEMP/AuthKey_*.p8
