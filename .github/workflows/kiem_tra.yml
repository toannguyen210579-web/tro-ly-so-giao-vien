name: Kiem tra va dong goi

on:
  push:
    # Chỉ đóng gói lại khi mã app thay đổi (sửa máy chủ không cần đóng gói app)
    paths-ignore: ["server/**", ".github/workflows/trien_khai_may_chu.yml", ".github/workflows/thu_gemini.yml", "**.md"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/chuan_bi.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tro-ly-so-gv-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    # Máy Mac tính phút gấp 10 lần, nên bản iPhone chỉ đóng gói khi bấm chạy tay
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Máy Intel mặc định dùng Xcode cũ; thư viện video_player cần Swift mới
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/chuan_bi.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build ios --release --no-codesign
