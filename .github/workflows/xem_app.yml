name: Xem app qua ảnh chụp
# Chụp lại 21/11/2026: gợi ý một dòng, con trỏ nhấp nháy trong ô hỏi
on:
  workflow_dispatch:
    inputs:
      buoc:
        description: "Chỉ chạy các bước này (cách nhau dấu phẩy); để trống là chạy hết"
        default: ""
      hau_to:
        description: "Hậu tố tên nhánh ảnh (ví dụ -1) khi chạy nhiều lượt riêng"
        default: ""
  push:
    branches: [noi-may-chu]
    paths: ["integration_test/xem_app_test.dart", ".github/workflows/xem_app.yml"]
permissions:
  contents: write
jobs:
  chup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bật KVM cho máy giả lập
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: bash tool/chuan_bi.sh
      - run: flutter pub get
      - name: Chạy app trên Android 14, đi qua các tiện ích, chụp màn hình
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/xem_app_test.dart --dart-define=BUOC=${{ github.event.inputs.buoc }} 2>&1 | tee ket_qua.txt; grep -E "KQ|All tests passed|Some tests failed|EXCEPTION" ket_qua.txt | head -80; echo "== Nhật ký hệ thống máy giả lập (app có bị tắt không)"; timeout 20 adb logcat -d -b main,system,crash 2>/dev/null | grep -iE "lmkd|lowmemory|Killing|has died|FATAL|Out of memory" | tail -30
      - name: Đẩy ảnh lên nhánh anh-xem-app (để tải về bằng git)
        if: always()
        run: |
          mkdir -p /tmp/anh
          cp anh_chay_thu/xem_*.png /tmp/anh/ 2>/dev/null || true
          grep -E "KQ|All tests passed|Some tests failed|EXCEPTION" ket_qua.txt > /tmp/anh/ket_qua.txt 2>/dev/null || true
          cd /tmp/anh
          git init -q -b anh-xem-app${{ github.event.inputs.hau_to }}
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Ảnh xem app (${GITHUB_SHA::7})"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" anh-xem-app${{ github.event.inputs.hau_to }}
