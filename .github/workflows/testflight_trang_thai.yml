name: TestFlight trang thai nguoi thu
# Xem người thử trong nhóm "Thử nội bộ" đã nhận lời mời chưa, bản nào cài được, và gửi lại thư mời.
# Email được che trong nhật ký (kho công khai). Thêm 24/11/2026.
on:
  workflow_dispatch:
    inputs:
      gui_lai:
        description: "Gửi lại thư mời cho người chưa nhận (co/khong)"
        default: "co"
  push:
    branches: [noi-may-chu]
    paths: [".github/workflows/testflight_trang_thai.yml"]

permissions:
  contents: read

jobs:
  xem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cài thư viện ký JWT
        run: pip install --quiet pyjwt cryptography
      - name: Xem trạng thái, gửi lại thư mời
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 4J84ST68KM
          ASC_ISSUER_ID: adfaa10b-1308-4779-8c38-1729ecad72df
          APP_ID: "6838612892"
          TEN_NHOM: "Thử nội bộ"
          GUI_LAI: ${{ github.event.inputs.gui_lai || 'co' }}
        shell: python
        run: |
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          import jwt
          KEY = os.environ["ASC_KEY_P8"]
          KID, ISS, APP, TEN = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"], os.environ["APP_ID"], os.environ["TEN_NHOM"]
          BASE = "https://api.appstoreconnect.apple.com"

          def bao(m):
              print(f"::notice title=TestFlight::{m}")

          def token():
              now = int(time.time())
              return jwt.encode({"iss": ISS, "iat": now, "exp": now + 1100, "aud": "appstoreconnect-v1"},
                                KEY, algorithm="ES256", headers={"kid": KID, "typ": "JWT"})

          def api(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(BASE + path, data=data, method=method,
                                           headers={"Authorization": "Bearer " + token(), "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read()
                      return r.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try:
                      return e.code, json.loads(raw)
                  except Exception:
                      return e.code, {"raw": raw.decode(errors="replace")[:300]}

          def che(e):
              if not e or "@" not in e:
                  return "?"
              a, b = e.split("@", 1)
              return a[:3] + "***@" + b

          st, js = api("GET", "/v1/betaGroups?" + urllib.parse.urlencode({"filter[app]": APP, "limit": 50}))
          nhom = next((g for g in js.get("data", []) if g["attributes"]["name"] == TEN), None)
          if not nhom:
              print("::error::Không thấy nhóm"); sys.exit(1)
          bao(f"Nhóm {TEN}: nội bộ={nhom['attributes'].get('isInternalGroup')}")

          st, js = api("GET", f"/v1/betaGroups/{nhom['id']}/builds?limit=20&fields[builds]=version,processingState,expired")
          for b in js.get("data", []):
              a = b["attributes"]
              st2, d = api("GET", f"/v1/builds/{b['id']}/buildBetaDetail")
              bd = d.get("data", {}).get("attributes", {})
              bao(f"Bản số {a['version']}: {a['processingState']}, hết hạn={a['expired']}, thử nội bộ={bd.get('internalBuildState')}")

          st, js = api("GET", f"/v1/betaGroups/{nhom['id']}/betaTesters?limit=50")
          for t in js.get("data", []):
              a = t["attributes"]
              bao(f"Người thử {che(a.get('email'))}: kiểu mời {a.get('inviteType')}, trạng thái {a.get('state')}")
              if os.environ["GUI_LAI"].startswith("co") and a.get("state") in ("INVITED", "NOT_INVITED", None):
                  st3, r = api("POST", "/v1/betaTesterInvitations", {"data": {"type": "betaTesterInvitations",
                      "relationships": {"app": {"data": {"type": "apps", "id": APP}},
                                        "betaTester": {"data": {"type": "betaTesters", "id": t["id"]}}}}})
                  bao(f"  Gửi lại thư mời: HTTP {st3}" + ("" if st3 in (200, 201) else " " + str(r)[:200]))
