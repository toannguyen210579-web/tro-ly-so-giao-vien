name: Triển khai máy chủ

on:
  push:
    branches: [main, noi-may-chu]
    paths: ["server/**", ".github/workflows/trien_khai_may_chu.yml"]
  workflow_dispatch:

concurrency:
  group: trien-khai-may-chu
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra cú pháp
        run: node --check server/worker.js && node --check server/gemini/worker.js
      - name: Kiểm thử máy chủ (giả lập, không gọi AI thật)
        run: node --test server/test/*.test.mjs
      - name: Triển khai máy chủ phụ Gemini
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: server/gemini
          wranglerVersion: "4.165.0"
          command: deploy
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Triển khai máy chủ chính
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: server
          wranglerVersion: "4.165.0"
          command: deploy
      - name: Đặt khóa giọng đọc Google (bỏ qua khi chưa có khóa)
        working-directory: server
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$GOOGLE_TTS_KEY" ]; then echo "Chưa có khóa giọng đọc, bỏ qua"; exit 0; fi
          printf '%s' "$GOOGLE_TTS_KEY" | npx --yes wrangler@4.165.0 secret put GOOGLE_TTS_KEY
      - name: Đặt khóa các cổng tìm kiếm, AI miễn phí (khóa nào chưa có thì bỏ qua)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          LANGSEARCH_API_KEY: ${{ secrets.LANGSEARCH_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "import json,os; t='TINYFISH_API_KEY LANGSEARCH_API_KEY EXA_API_KEY TAVILY_API_KEY FIRECRAWL_API_KEY GROQ_API_KEY CEREBRAS_API_KEY MISTRAL_API_KEY ZAI_API_KEY HF_TOKEN'.split(); d={k:os.environ[k] for k in t if os.environ.get(k)}; json.dump(d,open('/tmp/khoa.json','w')); print('Có khóa:', ', '.join(d) or 'chưa có')"
          if [ "$(cat /tmp/khoa.json)" != "{}" ]; then npx --yes wrangler@4.165.0 secret bulk /tmp/khoa.json; fi
          rm -f /tmp/khoa.json
      - name: Thử máy chủ
        run: |
          sleep 10
          curl -fsS https://tro-ly-gv.toannguyen210579.workers.dev/health
          curl -fsS -o /dev/null -w "ho-tro %{http_code}\n" https://tro-ly-gv.toannguyen210579.workers.dev/ho-tro
      - name: Nạp kho văn bản Hỏi Trợ lý (bỏ qua khi chưa có secret KT_KEY_CI)
        env:
          KT_KEY: ${{ secrets.KT_KEY_CI }}
        run: node server/kien-thuc/nap_ci.mjs
