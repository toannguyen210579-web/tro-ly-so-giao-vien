name: tro_ly_so_giao_vien
description: "Trợ lý số Giáo viên - Một chạm"
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  pdf: ^3.11.1
  image: ^4.2.0
  image_picker: ^1.1.2
  cunning_document_scanner: ^1.2.3
  google_mlkit_selfie_segmentation: ^0.10.0
  google_mlkit_text_recognition: ">=0.15.0 <1.0.0"
  google_mlkit_barcode_scanning: ">=0.14.0 <1.0.0"
  archive: ">=3.6.1 <5.0.0"
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.0
  video_player: ^2.9.0
  flutter_local_notifications: ^18.0.1
  timezone: ">=0.9.4 <1.0.0"
  file_picker: ^8.1.2
  # Giọng đọc tiếng Việt chạy trên máy. Giữ đúng 1.13.8: từ 2.0 thư viện bỏ bộ phát âm espeak nên không đọc được tiếng Việt
  sherpa_onnx: 1.13.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/tin/

# Biểu tượng app (tạo bằng: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
